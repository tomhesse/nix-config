name: check

on:
  push:
    branches: [main]
    paths-ignore: ["**.md", ".github/renovate.json"]
  pull_request:
    paths-ignore: ["**.md", ".github/renovate.json"]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            access-tokens = github.com=${{ secrets.GITHUB_TOKEN }}
            experimental-features = nix-command flakes

      - name: Run the hooks and check for flake.nix drift
        run: |
          nix build --no-link --print-build-logs \
            .#checks.x86_64-linux.pre-commit \
            .#checks.x86_64-linux.check-flake-file

      - name: Build the local packages
        run: |
          nix build --no-link --print-build-logs \
            .#media-ctl \
            .#power-menu

      - name: Evaluate every configuration
        run: |
          nix eval --json .#nixosConfigurations --apply \
            'cs: builtins.mapAttrs (_: c: c.config.system.build.toplevel.drvPath) cs'
          nix eval --json .#homeConfigurations --apply \
            'cs: builtins.mapAttrs (_: c: c.activationPackage.drvPath) cs'

      - name: Check that every container image tag exists
        run: |
          grep -rhoP '"\K[a-z0-9-]+(?:\.[a-z0-9-]+)+/[a-zA-Z0-9._/-]+:[a-zA-Z0-9._-]+(?=")' \
            --include='*.nix' modules/ | sort -u > /tmp/images.txt
          nix shell nixpkgs#skopeo -c bash -c '
            set -e
            while read -r image; do
              printf "%-55s " "$image"
              skopeo inspect --retry-times 3 --raw "docker://$image" > /dev/null
              echo ok
            done < /tmp/images.txt
          '
